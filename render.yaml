services:
  - type: web
    name: atrium-ai-resort-concierge
    runtime: python

    plan: free

    buildCommand: |
      pip install -r requirements.txt
      python -m backend.seed

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GOOGLE_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-2.5-flash

      - key: DATABASE_URL
        value: sqlite:///./resort.db

      - key: CHECKPOINT_DB_PATH
        value: ./checkpoints.sqlite

      - key: MAX_QTY_PER_ITEM
        value: "20"

      - key: MAX_ITEMS_PER_ORDER
        value: "15"

      - key: LLM_MAX_RETRIES
        value: "3"